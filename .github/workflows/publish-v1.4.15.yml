name: Publish v1.4.15 release

on:
  push:
    paths:
      - ".github/workflows/publish-v1.4.15.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      APK_NAME: NuvioRecommendationOpener-v1.4.15.apk
      APK_BLOB_SHA: b633ee21dd96c0188a2bf592c706c313dd673e8d
      APK_SHA256: 159d1162b0c17f5b10ac040477e31c16d39c5d9ca1ef6b9a92a28da3321a6695
    steps:
      - name: Download signed APK from repository blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${APK_BLOB_SHA}" --jq .content |
            tr -d '\n' |
            base64 --decode > "${APK_NAME}"
          echo "${APK_SHA256}  ${APK_NAME}" | sha256sum --check -

      - name: Create latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Nuvio Recommendation Opener 1.4.15

          - Improved Google TV recommendation and title detection.
          - Added verified matches for problematic movie and series titles.
          - Reduced duplicate openings when returning from Nuvio.
          - Added optional sponsored-row focus skipping.
          - Added low-frequency diagnostics for Google TV accessibility trees.

          Install the signed APK as an update over an earlier version. After installation, disable and enable the accessibility service once.
          EOF
          gh release create v1.4.15 "${APK_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Nuvio Recommendation Opener 1.4.15" \
            --notes-file release-notes.md \
            --latest
