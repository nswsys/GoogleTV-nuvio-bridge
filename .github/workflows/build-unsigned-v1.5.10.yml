name: Build unsigned v1.5.10
on:
  push:
    paths:
      - ".github/workflows/build-unsigned-v1.5.10.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew test assembleRelease
      - name: Align APK and collect signer
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk NuvioRecommendationOpener-v1.5.10-unsigned-aligned.apk
          cp "$BUILD_TOOLS/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: nuvio-bridge-v1.5.10-unsigned
          retention-days: 1
          if-no-files-found: error
          path: |
            NuvioRecommendationOpener-v1.5.10-unsigned-aligned.apk
            apksigner.jar
