name: Build signed v1.5.0
on:
  push:
    paths: [".github/workflows/build-signed-v1.5.0.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Create signing key
        run: |
          mkdir -p .signing
          keytool -genkeypair -v -keystore .signing/nuviobridge-release.jks -storepass android -keypass android -alias nuviobridge -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nuvio Bridge, O=NSWSYS, C=US"
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew test assembleRelease
      - name: Sign and verify
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk NuvioRecommendationOpener-v1.5.0-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks .signing/nuviobridge-release.jks --ks-key-alias nuviobridge --ks-pass pass:android --key-pass pass:android --out NuvioRecommendationOpener-v1.5.0.apk NuvioRecommendationOpener-v1.5.0-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs NuvioRecommendationOpener-v1.5.0.apk
          sha256sum NuvioRecommendationOpener-v1.5.0.apk .signing/nuviobridge-release.jks > SHA256SUMS.txt
